# Full stack: web (Vite) + api + worker
#   make dev-docker     → foreground, all services, logs in terminal
#   make docker-up      → background (api + worker only; use make dev for frontend)
#
# Requires backend/.env (DATABASE_URL) and root .env (VITE_SUPABASE_*).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/api"]
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      API_ADDR: ":8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/worker"]
    env_file:
      - ./backend/.env
    environment:
      WORKER_RUN_ONCE: "false"
    restart: unless-stopped

volumes:
  web_node_modules:
