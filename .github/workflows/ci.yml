name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          # Build-time only; the anon key is a public client key by design.
          # Values come from repo secrets so the build matches production.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  backend:
    name: Backend (Go vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  isolation:
    name: Cross-tenant RLS isolation
    runs-on: ubuntu-latest
    # Requires a disposable Supabase/Postgres instance. Skipped unless the
    # secret is configured, so the job never blocks on missing infrastructure
    # while still failing loudly once it is wired up.
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Run isolation suite
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "::warning::TEST_SUPABASE_URL not set — isolation suite skipped."
            echo "Beneficiary data is not protected by CI until this is configured."
            exit 0
          fi
          yarn test:isolation
